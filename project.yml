name: TidyAtlas
options:
  bundleIdPrefix: com.avradip
  deploymentTarget:
    iOS: "17.0"
packages:
  TidyCore:
    path: Packages/TidyCore
targets:
  TidyAtlas:
    type: application
    platform: iOS
    sources: [TidyAtlas]
    dependencies:
      - package: TidyCore
    info:
      path: TidyAtlas/Info.plist
      properties:
        CFBundleDisplayName: Tidy Atlas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        TAGitCommit: $(TA_GIT_COMMIT)
        TAGoogleClientID: $(TA_GOOGLE_CLIENT_ID)
        BGTaskSchedulerPermittedIdentifiers: [com.avradip.tidyatlas.upload]
        UIBackgroundModes: [processing]
        NSCameraUsageDescription: Tidy Atlas uses the camera and LiDAR to photograph rooms and things so Claude can tag them, to measure their size, to map the room and to show labels in AR.
        NSLocationWhenInUseUsageDescription: Tidy Atlas geotags your whole-place scans and photos with GPS so it knows which place and which room is where, and shows the place you're at first. Location is used only while the app is open.
        NSMicrophoneUsageDescription: The microphone is only used because iPhone videos include sound. Tidy Atlas uses still frames from walkthrough videos and ignores the sound.
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avradip.tidyatlas
        PRODUCT_NAME: TidyAtlas
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.4"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TA_GIT_COMMIT: dev
        # Same Google sign-in as Crystal Bowl; override with the repository variable GOOGLE_IOS_CLIENT_ID_TIDY.
        TA_GOOGLE_CLIENT_ID: "60541649934-sfas6f95kuv4jsr323f81bc99imtp60e.apps.googleusercontent.com"
