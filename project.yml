name: CrystalBowl
options:
  bundleIdPrefix: com.avradip
  deploymentTarget:
    iOS: "17.0"
packages:
  ScanMath:
    path: Packages/ScanMath
targets:
  CrystalBowl:
    type: application
    platform: iOS
    sources: [CrystalBowl]
    dependencies:
      - package: ScanMath
    info:
      path: CrystalBowl/Info.plist
      properties:
        CFBundleDisplayName: Crystal Bowl
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSCameraUsageDescription: Crystal Bowl uses the camera and LiDAR to photograph your rock sample and build a 3D model.
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avradip.crystalbowl
        PRODUCT_NAME: CrystalBowl
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
