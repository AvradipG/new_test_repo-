name: PaperQuest
options:
  bundleIdPrefix: com.avradip
  deploymentTarget:
    iOS: "17.0"
packages:
  PaperCore:
    path: Packages/PaperCore
targets:
  PaperQuest:
    type: application
    platform: iOS
    sources: [PaperQuest]
    dependencies:
      - package: PaperCore
    info:
      path: PaperQuest/Info.plist
      properties:
        CFBundleDisplayName: Paper Quest
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        PQGitCommit: $(PQ_GIT_COMMIT)
        PQGoogleClientID: $(PQ_GOOGLE_CLIENT_ID)
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avradip.paperquest
        PRODUCT_NAME: PaperQuest
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PQ_GIT_COMMIT: dev
        # Same Google sign-in as Crystal Bowl and Tidy Atlas; override with the repository variable GOOGLE_IOS_CLIENT_ID_PAPER.
        PQ_GOOGLE_CLIENT_ID: "60541649934-sfas6f95kuv4jsr323f81bc99imtp60e.apps.googleusercontent.com"
