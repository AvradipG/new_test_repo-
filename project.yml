name: AgentBoard
options:
  bundleIdPrefix: com.avradip
  deploymentTarget:
    iOS: "17.0"
targets:
  AgentBoard:
    type: application
    platform: iOS
    sources: [AgentBoard]
    info:
      path: AgentBoard/Info.plist
      properties:
        CFBundleDisplayName: Agent Board
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        ABGoogleClientID: $(AB_GOOGLE_CLIENT_ID)
        WKAppBoundDomains: [agent-board-181489801873.web.app]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avradip.agentboard
        PRODUCT_NAME: AgentBoard
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        AB_GOOGLE_CLIENT_ID: "181489801873-rk5rrgnv9980hdufoiddfj1h1s8qbcaf.apps.googleusercontent.com"
