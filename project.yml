name: TidyAtlas
options:
  bundleIdPrefix: com.avradip
  deploymentTarget:
    iOS: "17.0"
packages:
  TidyCore:
    path: Packages/TidyCore
targets:
  TidyAtlas:
    type: application
    platform: iOS
    sources: [TidyAtlas]
    dependencies:
      - package: TidyCore
    info:
      path: TidyAtlas/Info.plist
      properties:
        CFBundleDisplayName: Tidy Atlas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        TAGitCommit: $(TA_GIT_COMMIT)
        NSCameraUsageDescription: Tidy Atlas uses the camera to photograph rooms and things so Claude can tag them and suggest where they belong, and LiDAR to measure the room's shape.
        NSMicrophoneUsageDescription: The microphone is only used because iPhone videos include sound. Tidy Atlas uses still frames from walkthrough videos and ignores the sound.
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avradip.tidyatlas
        PRODUCT_NAME: TidyAtlas
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TA_GIT_COMMIT: dev
