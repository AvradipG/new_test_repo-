name: Build iPhone app

on:
  push:
    branches: [crystal-bowl-ios]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')"

      - name: Unit tests (measurement maths)
        run: swift test --package-path Packages/ScanMath

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild -project CrystalBowl.xcodeproj -scheme CrystalBowl -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CURRENT_PROJECT_VERSION=${{ github.run_number }} build > build.log 2>&1 || {
              grep -E "error:|error -|BUILD FAILED" build.log | sort -u | head -80
              grep -E ": error: " build.log | sort -u | head -40 | while IFS= read -r line; do
                f=$(echo "$line" | cut -d: -f1); l=$(echo "$line" | cut -d: -f2); m=$(echo "$line" | sed 's/^.*: error: //')
                echo "::error file=${f#$GITHUB_WORKSPACE/},line=$l::$m"
              done
              grep -E "error:" build.log | grep -v ": error: " | sort -u | head -10 | while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            }
          grep -E "warning:" build.log | sort -u | head -40 || true
          test -d build/Build/Products/Release-iphoneos/CrystalBowl.app

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CrystalBowl.app Payload/
          zip -qry CrystalBowlScanner.ipa Payload
          ls -la CrystalBowlScanner.ipa

      - name: Publish IPA to the ipa branch
        run: |
          SHA=$(git rev-parse --short HEAD)
          mkdir -p /tmp/pub && cp CrystalBowlScanner.ipa /tmp/pub/
          cd /tmp/pub
          printf "Built from %s on %s\n" "$SHA" "$(date -u +%Y-%m-%dT%H:%MZ)" > BUILD.txt
          git init -q -b ipa
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "IPA from $SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ipa
          echo "::notice::IPA published: https://github.com/${{ github.repository }}/raw/ipa/CrystalBowlScanner.ipa"

      - name: Check TestFlight keys
        id: tf
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$ASC_KEY_P8" ] && [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TestFlight upload skipped: add ASC_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID and APPLE_TEAM_ID as repository secrets to enable it."
          fi

      - name: Sign and upload to TestFlight
        if: steps.tf.outputs.enabled == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project CrystalBowl.xcodeproj -scheme CrystalBowl -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/CrystalBowl.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            "${AUTH[@]}" archive > archive.log 2>&1 || {
              grep -E "error:|error -|ARCHIVE FAILED" archive.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            }
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/CrystalBowl.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/upload "${AUTH[@]}" > upload.log 2>&1 || {
              grep -iE "error|failed" upload.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
              exit 1
            }
          rm -f "$KEY"
          echo "::notice::Build ${{ github.run_number }} uploaded to App Store Connect. It appears in TestFlight after Apple finishes processing (usually 5-15 minutes)."

      - uses: actions/upload-artifact@v4
        with:
          name: CrystalBowlScanner-ipa
          path: CrystalBowlScanner.ipa

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
